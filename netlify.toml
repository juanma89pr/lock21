[build]
  command = "npm run lint && npm run test:frases && npm run test:grupos && npm run test:publicador && npm run test:correos && npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # 10 nov 2026 (Juanma): cada deploy cuesta 15 créditos de Netlify, que
  # comparte con Balancet. No se compila si el commit solo toca lo que la
  # web no usa (docs/, .github/, herramientas/, contenido/cifras.json, .md):
  # así no gastan las cifras diarias ni las ideas para grabar. Ver el guion.
  ignore = "sh scripts/netlify-ignorar.sh"

# La clave web de Firebase es pública por diseño; se excluye del escáner de secretos de Netlify.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCRUHd1K6-MU7mWd1MKoIuMb81YIUvqblE"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Publicador de Instagram (docs/publicador-instagram.md). Horas en UTC.
[functions."publicar-instagram"]
  schedule = "*/5 * * * *"

# En pausa desde el 10 nov 2026: sin horario (y la función sale sin enviar nada).
# [functions."correos-programados"]
#   schedule = "7 * * * *"

[functions."renovar-token-instagram"]
  schedule = "17 4 * * 1"

# Pantalla de compartir que enlazan los correos (la sirve la misma web).
[[redirects]]
  from = "/dentro"
  to = "/index.html"
  status = 200

# Acceso directo al panel del propietario.
[[redirects]]
  from = "/admin"
  to = "/app/admin"
  status = 301

# La app del reto vive bajo /app (SPA); la landing sigue en /.
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Frame-Options = "DENY"
