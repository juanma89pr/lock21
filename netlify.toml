[build]
  command = "npm run lint && npm run test:frases && npm run test:grupos && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# La clave web de Firebase es pública por diseño; se excluye del escáner de secretos de Netlify.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCRUHd1K6-MU7mWd1MKoIuMb81YIUvqblE"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# La app del reto vive bajo /app (SPA); la landing sigue en /.
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Frame-Options = "DENY"
